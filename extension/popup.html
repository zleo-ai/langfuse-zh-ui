<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Langfuse 中文界面</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Langfuse 中文界面</h1>
    <p>离线中文改进版 · 0.4.0</p>
    <button id="translate" type="button">切换为中文</button>
    <button id="restore" type="button">恢复英文</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">执行记录：一次问答中的模型与工具步骤。<br>对话记录：同一聊天中的多轮问答。<br>JSON、问答原文和自定义名称保持原样。</p>
    <p class="hint">刷新或重新打开页面后，再点“切换为中文”。</p>
    <script src="popup.js"></script>
  </body>
</html>
